name: Manual Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        default: release
        type: choice
        options: [release, debug]
      arch:
        description: Windows 架构
        default: x64
        type: choice
        options: [x64, arm64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      PACKAGE_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows
          cache-variant: manual-${{ inputs.build_type }}
      - name: 构建应用
        shell: bash
        run: flutter build windows --"$BUILD_TYPE" --no-pub
      - name: 校验架构并创建测试包
        id: package
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/release.cjs').packageApp({core, context, manual: true});
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
