name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: 1.0.8)'
        required: true
        default: '1.0.8'
      language:
        description: '安装说明与发布说明语言'
        default: zh
        type: choice
        options: [zh, en]
      draft:
        description: '创建草稿版本'
        default: true
        type: boolean
      update_pubspec:
        description: '同步提交 pubspec.yaml 版本号（保留构建号）'
        default: true
        type: boolean

permissions:
  contents: read

# Avoid competing version commits and release uploads on the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: 检查发布工具
        run: node --test .github/scripts/release.test.cjs
      - name: 准备统一版本和源码
        id: version
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATE_PUBSPEC: ${{ inputs.update_pubspec }}
        with:
          script: |
            require('./.github/scripts/release.cjs').prepare({core, context});

  build:
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: macos-26-intel
            platform: macos
            arch: universal
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      PACKAGE_LANGUAGE: ${{ inputs.language }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          platform: ${{ matrix.platform }}
          cache-variant: release-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build_number }}
      - name: 构建发布版本（每个平台仅一次）
        shell: bash
        run: |
          build_flags=()
          if [ "$PACKAGE_PLATFORM" = windows ]; then
            # Otherwise Flutter hides the underlying CMake INSTALL error.
            build_flags+=(--verbose)
          fi
          flutter build "$PACKAGE_PLATFORM" --release --no-pub --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER" "${build_flags[@]}"
      - name: 校验架构、打包和生成 SHA256
        id: package
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/release.cjs').packageApp({core, context});
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: light_novel_image-v${{ needs.prepare.outputs.version }}-*
          path: artifacts
          merge-multiple: true
      - name: 验证三个安装包并生成发布说明
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_LANGUAGE: ${{ inputs.language }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').releaseBody({context});
      - name: 发布
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Light Novel Image Viewer v${{ needs.prepare.outputs.version }}
          body_path: release_body.md
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: ${{ inputs.draft }}
          prerelease: false
