name: Flutter Analysis and Tests

on:
  workflow_dispatch:
    inputs:
      run_analyze:
        description: '是否运行代码分析'
        required: false
        default: true
        type: boolean
      run_tests:
        description: '是否运行测试'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      
    - uses: ./.github/actions/setup-flutter

    - name: 检查发布工具
      run: node --test .github/scripts/release.test.cjs
      
    - name: 代码分析
      if: github.event.inputs.run_analyze == 'true'
      run: flutter analyze --no-pub
      
    - name: 运行测试
      if: github.event.inputs.run_tests == 'true'
      run: flutter test --no-pub
